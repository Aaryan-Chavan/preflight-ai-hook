[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight-ai"
version = "1.0.0"
description = "Autonomous Pre-commit AI Telemetry & Quality Gates"
readme = "README.md"
authors = [
    { name = "Aaryan Chavan", email = "aaryan19chavan@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # CLI, Config & Logging
    "typer>=0.9.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "platformdirs>=4.2.0",
    "keyring>=25.0.0",
    "loguru>=0.7.3",
    
    # Pre-trained ML (Lightweight Inference)
    "xgboost>=3.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    
    # LLM & AI Clients
    "ollama>=0.1.0",
    "google-generativeai>=0.4.0",
    
    # Firebase & Network
    "firebase-admin>=6.2.0",
    "requests>=2.31.0",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "mypy>=1.9.0", "build", "twine"]

[project.scripts]
preflight = "preflight.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel.force-include]
"src/preflight/models" = "preflight/models"

[tool.ruff]
line-length = 100
target-version = "py312"